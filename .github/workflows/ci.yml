name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: laforika_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Generate ephemeral RS256 keys and env
        working-directory: backend
        run: |
          mkdir -p secrets
          openssl genrsa -out secrets/jwt-private.pem 2048
          openssl rsa -in secrets/jwt-private.pem -pubout -out secrets/jwt-public.pem
          PEPPER=$(openssl rand -hex 32)
          FIXTURE=$(openssl rand -hex 32)
          cat > .env <<EOF
          APP_ENVIRONMENT=test
          PORT=3000
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/laforika_test
          JWT_ISSUER=https://auth.laforika.local
          JWT_AUDIENCE=laforika-app
          JWT_ACTIVE_KID=ci-1
          JWT_PRIVATE_KEY_PATH=./secrets/jwt-private.pem
          JWT_PUBLIC_KEY_PATH=./secrets/jwt-public.pem
          REFRESH_TOKEN_PEPPER=$PEPPER
          OTP_CODE_PEPPER=$PEPPER
          PASSWORD_PEPPER=$PEPPER
          FIXTURE_DELIVERY_ENABLED=true
          FIXTURE_INBOX_KEY=$FIXTURE
          CORS_ORIGINS=*
          EOF
          cp .env .env.test

      - name: Prisma validate and migrate
        working-directory: backend
        run: |
          npm run prisma:validate
          npx prisma migrate deploy
          npx prisma generate

      - name: Prisma format check
        run: npm run prisma:format:check --prefix backend

      - name: Format check
        run: npm run format:check --prefix backend

      - name: Lint
        run: npm run lint --prefix backend

      - name: Typecheck
        run: npm run typecheck --prefix backend

      - name: Unit tests
        run: npm run test --prefix backend

      - name: E2E tests
        working-directory: backend
        run: npm run test:e2e

      - name: OpenAPI contract check
        working-directory: backend
        run: npm run openapi:check

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate DTOs
        run: dart run build_runner build

      - name: Verify generated outputs are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated output check failed: dirty tree after codegen"
            git status --porcelain
            git diff -- || true
            exit 1
          fi

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Import boundaries
        run: dart run tool/check_import_boundaries.dart

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

  android-debug-flavors:
    name: android-debug-${{ matrix.flavor }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [dev, staging, prod]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build debug APK (${{ matrix.flavor }})
        run: |
          flutter build apk --debug --flavor "${{ matrix.flavor }}" \
            --dart-define=APP_FLAVOR="${{ matrix.flavor }}" \
            --dart-define-from-file="config/${{ matrix.flavor }}.json"

      - name: Upload debug APK (non-publishable)
        uses: actions/upload-artifact@v4
        with:
          name: laforika-${{ matrix.flavor }}-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  android-auth-integration:
    name: android-auth-integration
    needs: [quality, backend]
    # ubuntu-latest (24.04) currently fails to keep the emulator attached
    # ("adb: device emulator-5554 not found" until boot timeout).
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: laforika_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Prepare backend secrets and migrate
        working-directory: backend
        run: |
          mkdir -p secrets
          openssl genrsa -out secrets/jwt-private.pem 2048
          openssl rsa -in secrets/jwt-private.pem -pubout -out secrets/jwt-public.pem
          PEPPER=$(openssl rand -hex 32)
          FIXTURE=$(openssl rand -hex 32)
          cat > .env <<EOF
          APP_ENVIRONMENT=dev
          PORT=3000
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/laforika_test
          JWT_ISSUER=https://auth.laforika.local
          JWT_AUDIENCE=laforika-app
          JWT_ACTIVE_KID=ci-1
          JWT_PRIVATE_KEY_PATH=./secrets/jwt-private.pem
          JWT_PUBLIC_KEY_PATH=./secrets/jwt-public.pem
          REFRESH_TOKEN_PEPPER=$PEPPER
          OTP_CODE_PEPPER=$PEPPER
          PASSWORD_PEPPER=$PEPPER
          FIXTURE_DELIVERY_ENABLED=true
          FIXTURE_INBOX_KEY=$FIXTURE
          CORS_ORIGINS=*
          EOF
          npx prisma migrate deploy
          npx prisma generate
          echo "FIXTURE_INBOX_KEY=$FIXTURE" >> "$GITHUB_ENV"

      - name: Build backend
        working-directory: backend
        run: |
          npm run build
          test -f dist/main.js

      - name: Start backend
        working-directory: backend
        run: |
          set -a
          # shellcheck disable=SC1091
          . ./.env
          set +a
          npm run start:prod > /tmp/laforika-backend.log 2>&1 &
          echo $! > /tmp/laforika-backend.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/v1/health >/dev/null; then
              echo "backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "backend failed to become ready"
          cat /tmp/laforika-backend.log || true
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free disk space for emulator userdata
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Run Android emulator auth integration
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_USER_HOME: /home/runner/.android
          ANDROID_EMULATOR_HOME: /home/runner/.android
          ANDROID_AVD_HOME: /home/runner/.android/avd
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 2048M
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            flutter pub get
            flutter test integration_test/auth_flow_test.dart --flavor dev \
              --dart-define=APP_FLAVOR=dev \
              --dart-define-from-file=config/dev.json \
              --dart-define=FIXTURE_INBOX_KEY=$FIXTURE_INBOX_KEY
