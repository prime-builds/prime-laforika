name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Verify generated localizations are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated localization check failed: dirty tree after flutter gen-l10n"
            git status --porcelain
            git diff -- || true
            exit 1
          fi

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Import boundaries
        run: dart run tool/check_import_boundaries.dart

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

  android-debug-flavors:
    name: android-debug-${{ matrix.flavor }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [dev, staging, prod]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build debug APK (${{ matrix.flavor }})
        run: |
          flutter build apk --debug --flavor "${{ matrix.flavor }}" \
            --dart-define=APP_FLAVOR="${{ matrix.flavor }}" \
            --dart-define-from-file="config/${{ matrix.flavor }}.json"

      - name: Upload debug APK (non-publishable)
        uses: actions/upload-artifact@v4
        with:
          name: laforika-${{ matrix.flavor }}-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
